name: "Tests"
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional jasmine filter; empty runs the full suite'
        required: false
        default: ''

jobs:
  Test:
    strategy:
      fail-fast: false
      matrix:
        # upstream ran ['lts/*', 'node'], which at the 2021-05-27 release meant
        # Node 14 and Node 16; jasmine 3.7's loader.js uses dynamic import(),
        # which is a hard SyntaxError on Node 8 despite engines.node >= 8.16.2
        node_version: [14, 16]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node_version }}
      - name: Pin registry to the release date
        run: |
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set //time-machines-npm.sealsecurity.io/:_authToken=2021-05-27T00:00:00.000000Z
      - name: Install Dependencies
        run: npm ci
      - name: Run Unit Tests 👩🏽‍💻
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npm run test:unit -- --filter="${{ inputs.test-filter }}"
          else
            npm run test:unit
          fi
      - name: Run Spec Tests 👩🏽‍💻
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npm run test:specs -- --filter="${{ inputs.test-filter }}"
          else
            npm run test:specs
          fi
      # marked ships lib/marked.js and marked.min.js inside the tarball, so a fix
      # in src/ has to reach them too. lib/*.js are patched directly (rollup would
      # otherwise restamp the copyright banner with the current year); marked.min.js
      # is regenerated from the patched lib/marked.js with the pinned uglify-js.
      - name: Re-minify the browser bundle 🗜️
        if: matrix.node_version == 14
        run: npm run minify
      - name: Match the publishing npm version 📦
        if: matrix.node_version == 14
        run: npm i -g npm@7.12.0
      - name: Pack 🗜️
        if: matrix.node_version == 14
        run: npm pack
      - name: Upload Tarball ⬆️
        if: matrix.node_version == 14
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: marked-*.tgz
          if-no-files-found: error
